<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Odin Admin Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="sidebar">
        <div class="logo">
            <img src="" alt="logo">
            <h1>Dashboard</h1>
        </div>
        <div class="nav">
            <img src="" alt="house">
            <a>Home<a>
            <img src="" alt="id card">
            <a>Profile</a>
            <img src="" alt="chatbox">
            <a>Messages</a>
            <img src="" alt="clock">
            <a>History</a>
            <img src="" alt="pages">
            <a>Tasks</a>
            <img src="" alt="people">
            <a>Communities</a>
        </div>
        <div class="help">
            <img src="" alt="gear">
            <a>Settings</a>
            <img src="" alt="question box">
            <a>Support</a>
            <img src="" alt="check shield">
            <a>Privacy</a>
        </div>
    </div>
    <div class="header">
        <div class="header-top">
            <div class="search">
                <img src="" alt="magnifying glass">
                <input type="search">
            </div>
            <div class="profile">
                <img src="" alt="ringing bell">
                <img src="" alt="profile pic">
                <p class="name">Nevin Speakman</p>
            </div>
        </div>
        <div class="header-bottom">
            <div class="profile-info">
                <img src="" alt="profile pic">
                <div class="welcome">
                    <p>Hi there,</p>
                    <h1>Nevin Speakman (@nevin)</h1>
                </div>
            </div>
            <div class="action-buttons">
                <button>New</button>
                <button>Upload</button>
                <button>Share</button>
            </div>
        </div>
    </div>
    <div class="main-content">
        <div class="projects-container">
            <h2>Your Projects</h2>
            <div class="projects">
                <div class="project"></div>
                <div class="project"></div>
                <div class="project"></div>
                <div class="project"></div>
                <div class="project"></div>
                <div class="project"></div>
            </div>
        </div>
        <div class="announcements-container">
            <h2>Announcements</h2>
            <div class="announcements">
                <div class="announcement"></div>
                <div class="announcement"></div>
                <div class="announcement"></div>
            </div>
        </div>
        <div class="trending-container">
            <h2>Trending</h2>
            <div class="trending-accounts">
                <div class="trending-account"></div>
                <div class="trending-account"></div>
                <div class="trending-account"></div>
                <div class="trending-account"></div>
            </div>
        </div>
    </div>
</body>
</html>
